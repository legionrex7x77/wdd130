<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Blue Crystal River Adventures</title>

    <meta name="description"
      content="Contact Blue Crystal River Adventures for rafting reservations, general questions, and information about our services.">

    <meta name="author" content="Cuitlahuac Ricardo Corona Espinoza">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/z-raftingcompas.jpg" alt="Blue Crystal River Adventures logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-intro">
            <h1>Blue Crystal River Adventures</h1>

            <address>
                123 Fake Street<br>
                Saint Paul, Kolob<br>
                Phone: +1 237-777-7787<br>
                Email: info@test.com
            </address>
        </section>

        <section class="contact-layout">

            <div class="map-box">
                <iframe src="https://www.google.com/maps?q=Saint%20Paul%20Minnesota&output=embed"
                  loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                  title="Location of Blue Crystal River Adventures">
                </iframe>
            </div>

            <div class="contact-form">

                <form>

                    <div class="form-row">
                        <label for="fullname">Name</label>

                        <input type="text" id="fullname" name="fullname"
                          placeholder="Enter your name" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>

                        <input type="email" id="email" name="email" placeholder="Enter your email"
                          required>
                    </div>

                    <fieldset>
                        <legend>Message Purpose</legend>

                        <label>
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <div class="form-row message-row">
                        <label for="message">Message</label>

                        <textarea id="message" name="message" rows="5"
                          placeholder="Type your message here" required></textarea>
                    </div>

                    <label class="newsletter">
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">
                        Get in Touch!
                    </button>

                </form>

            </div>

        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/employee1.jpeg"
                      alt="General manager of Blue Crystal River Adventures">

                    <figcaption>
                        General Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpeg"
                      alt="Lead rafting guide of Blue Crystal River Adventures">

                    <figcaption>
                        Lead Rafting Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpeg"
                      alt="Reservation specialist of Blue Crystal River Adventures">

                    <figcaption>
                        Reservation Specialist
                    </figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Blue Crystal River Adventures |
            Cuitlahuac Corona. All rights reserved.
        </p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Visit our Facebook page">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="Visit our LinkedIn page">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Visit our Instagram page">
            </a>
        </nav>
    </footer>

</body>

</html>
